# config/nginx.conf
# Nginx configuration for TaskFlow + Unicorn
# Place this file at: /etc/nginx/sites-available/taskflow
# Then: sudo ln -s /etc/nginx/sites-available/taskflow /etc/nginx/sites-enabled/taskflow

upstream taskflow_unicorn {
  # Use Unix socket (faster than TCP when nginx and unicorn are on same machine)
  server unix:/var/www/taskflow/shared/tmp/sockets/unicorn.sock fail_timeout=0;

  # TCP alternative (uncomment if deploying across machines):
  # server 127.0.0.1:8080 fail_timeout=0;
}

server {
  listen 80;
  server_name YOUR_DOMAIN_OR_IP;

  # Redirect HTTP → HTTPS (uncomment when SSL is set up)
  # return 301 https://$host$request_uri;

  root /var/www/taskflow/current/public;
  access_log /var/log/nginx/taskflow_access.log;
  error_log  /var/log/nginx/taskflow_error.log;

  # Serve static assets directly from disk (bypasses Rails/Unicorn entirely)
  location ^~ /assets/ {
    gzip_static on;
    expires     max;
    add_header  Cache-Control public;
  }

  # Everything else goes to Unicorn
  location / {
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  Host              $http_host;
    proxy_redirect    off;

    # If the file exists as a static file, serve it directly
    if (-f $request_filename) { break; }
    if (-f $request_filename/index.html) { rewrite (.*) $1/index.html break; }
    if (-f $request_filename.html) { rewrite (.*) $1.html break; }

    if (!-f $request_filename) {
      proxy_pass http://taskflow_unicorn;
      break;
    }
  }

  # Custom error pages
  error_page 404              /404.html;
  error_page 500 502 503 504  /500.html;

  location = /404.html { root /var/www/taskflow/current/public; }
  location = /500.html { root /var/www/taskflow/current/public; }

  client_max_body_size 10M;
  keepalive_timeout    65;
}

# HTTPS server block (uncomment and configure after getting SSL certificate)
# server {
#   listen 443 ssl;
#   server_name YOUR_DOMAIN_OR_IP;
#
#   ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
